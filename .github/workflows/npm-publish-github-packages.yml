# This workflow will run tests using node and then publish a package to npm when a release is created
# Publishing uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requires npm 11.5.1 or later
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # npm 11 requires an explicit tag for prerelease versions. Every release
      # so far is a beta, so keep publishing them as "latest". Switch
      # prereleases to "--tag beta" once stable releases exist.
      - run: npm publish --tag latest
